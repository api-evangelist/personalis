# Personalis integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in personalis-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: personalis-eudamed-eu-ivdr-manufacturers
  label: EUDAMED (EU IVDR manufacturers)
  partner_name: EUDAMED (EU IVDR manufacturers)
  category: EU IVDR-registered manufacturer
  type: contract
  channel: regulator-register
  evidence: https://ec.europa.eu/tools/eudamed/#/screen/search-eo/9425e8e6-27de-4509-99fd-ede7c786a5db
  source: edge
  relationship: standard-participant
  contract_reference:
    register: EUDAMED public API (UDI-DI data, applicable legislation IVDR; actor public information)
    standard: EU IVDR (Regulation (EU) 2017/746) manufacturer + UDI registration
    spec_file: null
    role: eudamed-ivdr-manufacturer
    registered_name: Personalis, Inc.
    matched_domain: personalis.com
    matched_by: domain
    detected_by: sweep-ivd-diagnostics.py
    detected: '2026-10-21'
    register_id: US-MF-000050141
    register_country: US
    actor_status: active
    domain_from: registered e-mail domain
    trade_names_sample:
    - The Personalis cfDNA Blood Collection Kit
    certified_products:
    - product: EU IVDR device registration, class A
      product_type: IVDR class A
      lapsed: false
      statuses:
      - on-the-market
    signal_note: 'certified_products = one entry per IVDR RISK CLASS with registered devices, never per device;
      lapsed when no device of that class is on the market. Self-filed actor registration: domain + name check +
      country agreement, hand-reviewed'
  status: not-a-workflow
  arazzo: null
