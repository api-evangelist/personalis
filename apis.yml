name: Personalis
description: Personalis, Inc. (NASDAQ PSNL) is a clinical genomics and cancer diagnostics company based
  in Fremont, California. It develops advanced tumor and immune profiling tests built on next-generation
  sequencing, including its NeXT Personal ultra-sensitive tumor-informed molecular residual disease (MRD)
  and recurrence-monitoring assay and the ImmunoID NeXT whole-exome and transcriptome platform used for
  translational cancer research, biopharma partnerships, and population sequencing programs. Personalis
  operates as a diagnostics laboratory and research-services provider; its offerings are delivered as
  clinical tests, sequencing services, and analytical reports rather than as a public developer API. No
  public developer portal, API reference, or SDK is published as of this enrichment pass.
